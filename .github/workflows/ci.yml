name: ci

on:
  push:
    branches: [main]
    tags: ['v*']
  pull_request:

permissions:
  contents: read

jobs:
  install-path:
    name: ${{ matrix.test }} (${{ matrix.arch }})
    strategy:
      fail-fast: false
      matrix:
        test: [registry, sideload, overlay]
        arch: [amd64, arm64]
        include:
          - arch: amd64
            runner: ubuntu-26.04
            goss_asset: goss_0.4.10_linux_x86_64.tar.gz
            goss_sha256: 26e365428946294bcec0c61d867bb3c8349f39feb3d0e6f59084e98632785cc7
          - arch: arm64
            runner: ubuntu-26.04-arm
            goss_asset: goss_0.4.10_linux_arm64.tar.gz
            goss_sha256: 90a59612b4d67d9f1a9038634c000790136bb82526a69de1e81ac075c2f6d2c6
    runs-on: ${{ matrix.runner }}
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install goss
        env:
          GOSS_ASSET: ${{ matrix.goss_asset }}
          GOSS_SHA256: ${{ matrix.goss_sha256 }}
        run: |
          curl -fsSLO "https://github.com/goss-org/goss/releases/download/v0.4.10/$GOSS_ASSET"
          echo "$GOSS_SHA256  $GOSS_ASSET" | sha256sum -c
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf "$GOSS_ASSET" -C "$RUNNER_TEMP/bin" goss
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      # A separate builder for bake, so compose build in the tests still
      # uses the local image store and sees computer-use-linux-mod:dev.
      - id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          use: false
      - name: Build the mod image and sideload tarball
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          source: .
          targets: mod,tar
      - name: Run the test
        env:
          TEST: ${{ matrix.test }}
        run: tests/"$TEST"/test.sh

  # The sideload test on each webtop desktop, X11 and Wayland, amd64 only.
  # Alpine packages no wmctrl, so X11 xfce and MATE there have no window control.
  desktop:
    name: desktop ${{ matrix.image }}${{ matrix.wayland && ' wayland' || '' }}
    strategy:
      fail-fast: false
      matrix:
        include:
          - {image: alpine-kde, wayland: '', window_control: '1'}
          - {image: latest, wayland: '', window_control: '0'}
          - {image: latest, wayland: 'true', window_control: '1'}
          - {image: alpine-mate, wayland: '', window_control: '0'}
          - {image: alpine-mate, wayland: 'true', window_control: '0'}
          - {image: alpine-i3, wayland: '', window_control: '1'}
          - {image: alpine-i3, wayland: 'true', window_control: '1'}
          - {image: debian-kde, wayland: '', window_control: '1'}
          - {image: debian-kde, wayland: 'true', window_control: '1'}
    runs-on: ubuntu-26.04
    steps:
      - uses: actions/checkout@11bd71901bbe5b1630ceea73d27597364c9af683 # v4.2.2
      - name: Install goss
        run: |
          curl -fsSLO https://github.com/goss-org/goss/releases/download/v0.4.10/goss_0.4.10_linux_x86_64.tar.gz
          echo "26e365428946294bcec0c61d867bb3c8349f39feb3d0e6f59084e98632785cc7  goss_0.4.10_linux_x86_64.tar.gz" | sha256sum -c
          mkdir -p "$RUNNER_TEMP/bin"
          tar -xzf goss_0.4.10_linux_x86_64.tar.gz -C "$RUNNER_TEMP/bin" goss
          echo "$RUNNER_TEMP/bin" >> "$GITHUB_PATH"
      - id: buildx
        uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
        with:
          use: false
      - name: Build the mod image and sideload tarball
        uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        with:
          builder: ${{ steps.buildx.outputs.name }}
          source: .
          targets: mod,tar
      - name: Run the sideload test on this desktop
        env:
          BASE_IMAGE: lscr.io/linuxserver/webtop:${{ matrix.image }}
          WAYLAND: ${{ matrix.wayland }}
          EXPECT_WINDOW_CONTROL: ${{ matrix.window_control }}
        # An empty PIXELFLUX_WAYLAND would override the image's own default.
        run: |
          if [ -n "$WAYLAND" ]; then export PIXELFLUX_WAYLAND="$WAYLAND"; fi
          tests/sideload/test.sh

  publish:
    needs: [install-path, desktop]
    if: github.event_name == 'push' && startsWith(github.ref, 'refs/tags/v')
    runs-on: ubuntu-26.04
    permissions:
      contents: read
      packages: write
    steps:
      - uses: docker/setup-qemu-action@99012661954931238ded8c8b007157a8430204e1 # v4.4.0
      - uses: docker/setup-buildx-action@f87e5991a6d7451dcb8d9637bfbc97413f497069 # v4.4.1
      - uses: docker/login-action@8aa5831fb8d48d8f76594c7ddde61ae58019f550 # v4.8.0
        with:
          registry: ghcr.io
          username: ${{ github.actor }}
          password: ${{ secrets.GITHUB_TOKEN }}
      - uses: docker/bake-action@59cb1203cd42bcefd40a1b6d73b589e48c86040e # v7.5.0
        env:
          GIT_TAG: ${{ github.ref_name }}
        with:
          targets: publish
          push: true
